# ~/.config/yazi/yazi.toml

[[opener.add-sub]]
run  = ''' printf "sub-add '%%s'\n" %s1 | socat - /tmp/mpv.sock '''
desc = "Add sub to MPV"

[open]
prepend_rules = [
  { url = "*.kitty-session", use = "edit" },
  { url = "*.{ass,srt,ssa,sty,sup,vtt}", use = [ "add-sub", "edit" ] },
]

[plugin]
prepend_previewers = [
  { url = "*.kitty-session", run = "kitty-session" },
]
