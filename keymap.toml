# "$schema" = "https://yazi-rs.github.io/schemas/keymap.json"

[mgr]

prepend_keymap = [

  # ========== Navigation ==========

  { on = "l",       run = "plugin smart-enter",    desc = "Enter directory or open file" },
  { on = "<Right>", run = "plugin smart-enter",    desc = "Enter directory or open file" },
  { on = "[",       run = "plugin parent-arrow -1", desc = "Move up in parent directory" },
  { on = "]",       run = "plugin parent-arrow 1",  desc = "Move down in parent directory" },

  # ========== Tabs ==========

  { on = ["g", "t"], run = "tab_switch 1 --relative",  desc = "Next tab" },
  { on = ["g", "T"], run = "tab_switch -1 --relative", desc = "Prev tab" },
  { on = "<C-i>",    run = "forward",                  desc = "Go forward in history" },
  { on = "<C-o>",    run = "back",                     desc = "Go back in history" },
  { on = "q", run = "close", desc = "Close the current tab, or quit if it's last"},

  # ========== Yank / Cut / Delete ==========

  { on  = ["y", "y"], run = ['shell -- for path in %s; do echo "file://$path"; done | wl-copy -t text/uri-list', "yank"], desc = "Copy selected files to the system clipboard while yanking"},
  { on  = ["<A-n>"],   run = "shell -- ripdrag %s --no-click -A -x 2>/dev/null &",          desc = "Drag and drop via dragon"},
  { on = ["d", "d"], run = "yank --cut",                           desc = "Cut selected files" },
  { on = ["d", "D"], run = "remove --permanently --force",         desc = "Permanently delete" },
  { on = ["<Delete>"], run = "remove --force",                     desc = "Delete" },

  # ========== Copy paths ==========

  { on = ["y", "p"], run = "copy path",                    desc = "Copy the full path" },
  { on = ["y", "d"], run = "copy dirname",                 desc = "Copy the directory path" },
  { on = ["y", "n"], run = "copy filename",                desc = "Copy the filename" },
  { on = ["y", "r"], run = "plugin copy-relative-path",    desc = "Copy the relative path" },

  # ========== Rename ==========

  { on = "<F2>",    run = "rename --cursor=before_ext", desc = "Rename (cursor before extension)" },
  { on = ["r", "n"], run = "rename --cursor=before_ext", desc = "Rename (cursor before extension)" },

  # ========== Shell ==========

  { on = "S", run = "shell --block --confirm zsh", desc = "Open ZSH shell" },

  # ========== Search ==========

  { on = ["r", "g"],  run = "search --via=rg",    desc = "Search files by content (rg)" },

  # ========== Jump ==========

  { on = "z",      run = "plugin smart-goto 'jump zoxide'", desc = "Jump via zoxide" },
  { on = "<C-t>",      run = "plugin smart-goto 'jump fzf'",    desc = "Jump or reveal via fzf" },

  # ========== Goto ==========

  { on = ["g", "h"],       run = "plugin smart-goto 'jump ~'",                desc = "Go to home directory" },
  { on = ["g", "c"],       run = "plugin smart-goto 'jump ~/.config'",         desc = "Go to config directory" },
  { on = ["g", "r" ],      run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"', desc = "cd back to the root of the current Git repository"},
  { on = ["g", "d"],       run = "plugin smart-goto 'jump follow ~/Downloads/'", desc = "Go to downloads directory" },
  { on = ["g", "t"],       run = "plugin smart-goto 'jump /tmp'",              desc = "Go to temp directory" },
  { on = ["g", "<Space>"], run = "plugin smart-goto 'jump interactive'",       desc = "Go to directory interactively" },

  # ========== Linemode (moved from m to n) ==========

  { on = ["M", "n"], run = "linemode none",        desc = "Set linemode: none" },
  { on = ["M", "s"], run = "linemode size",        desc = "Set linemode: size" },
  { on = ["M", "b"], run = "linemode btime",       desc = "Set linemode: btime" },
  { on = ["M", "m"], run = "linemode mtime",       desc = "Set linemode: mtime" },
  { on = ["M", "c"], run = "linemode ctime",       desc = "Set linemode: ctime" },
  { on = ["M", "p"], run = "linemode permissions",   desc = "Set linemode: permissions" },
  { on = ["M", "f"], run = "linemode file_count",     desc = "Set linemode: file count" },

  { on = ["m"],         run = "plugin bookmarks save",      desc = "Save current position as a bookmark" },
  { on = ["`"],         run = "plugin bookmarks jump",      desc = "Jump to a bookmark" },
  { on = ["b", "d"], run = "plugin bookmarks delete",     desc = "Delete a bookmark" },
  { on = ["b", "D"], run = "plugin bookmarks delete_all", desc = "Delete all bookmarks" },

]

